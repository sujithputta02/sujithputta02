<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @font-face {
  font-family: 'Press Start 2P';
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
  font-weight: normal;
  font-style: normal;
}

      .bg-sky { fill: #5c94fc; }
      .cloud { fill: #ffffff; }

      .text-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 13px;
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 2.5;
        paint-order: stroke fill;
      }
      .text-panel-header {
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        fill: #b83c18;
        font-weight: bold;
      }
      .text-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        fill: #4a3728;
        font-weight: bold;
      }
      .text-val {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        fill: #008800;
        font-weight: bold;
      }
      .text-rank {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        fill: #e52521;
        font-weight: bold;
      }

      /* Mario Dialogue Board with Beveled Border */
      .box-container {
        fill: #fce4a0;
        stroke: #000000;
        stroke-width: 3.5;
      }
      .box-inner {
        fill: none;
        stroke: #b83c18;
        stroke-width: 1.5;
      }

      .powerup-icon {
        animation: bouncePowerup 2s infinite ease-in-out;
      }
      .bar-glow {
        animation: barGlowPulse 2.5s infinite ease-in-out;
      }

      @keyframes bouncePowerup {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @keyframes barGlowPulse {
        0%, 100% { fill: #00a800; }
        50% { fill: #00f800; }
      }

      .cloud-bg-1 { animation: cloudDrift 60s infinite linear; }
      .cloud-bg-2 { animation: cloudDrift 90s infinite linear -30s; }

      @keyframes cloudDrift {
        0% { transform: translateX(850px); }
        100% { transform: translateX(-200px); }
      }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="850" height="340" class="bg-sky"/>

  <!-- Clouds -->
  <g class="cloud-bg-1" transform="translate(100, 10)">
    <path d="M120,20 C110,20 100,28 100,38 C90,38 80,46 80,56 C80,66 90,74 100,74 L160,74 C170,74 180,66 180,56 C180,46 170,38 160,38 C160,28 150,20 140,20 Z" class="cloud" opacity="0.6"/>
  </g>
  <g class="cloud-bg-2" transform="translate(500, 20)">
    <path d="M60,10 C55,10 50,14 50,19 C45,19 40,23 40,28 C40,33 45,37 50,37 L80,37 C85,37 90,33 90,28 C90,23 85,19 80,19 C80,14 75,10 70,10 Z" class="cloud" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="425" y="32" class="text-title" text-anchor="middle">> HERO METRICS &amp; REAL-TIME POWER-UPS &lt;</text>

  <!-- PANEL 1: HERO METRICS -->
  <g transform="translate(40, 50)">
    <rect width="365" height="230" rx="8" class="box-container"/>
    <rect x="6" y="6" width="353" height="218" rx="5" class="box-inner"/>
    <!-- Question Block Rivets on Corners -->
    <rect x="8" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="347" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="8" y="212" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="347" y="212" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>

    <text x="24" y="30" class="text-panel-header">> HERO METRICS</text>

    <!-- Commits -->
    <g transform="translate(24, 50)" class="powerup-icon">
      <path d="M3 8 C3 2, 13 2, 13 8 Z" fill="#a85400" stroke="#000" stroke-width="1"/>
      <rect x="5" y="8" width="6" height="3" fill="#fce4a0"/>
    </g>
    <text x="50" y="58" class="text-label">COMMITS STOMPED:</text>
    <text x="245" y="58" class="text-val" id="val-commits">923</text>

    <!-- Coins -->
    <g transform="translate(24, 90)" class="powerup-icon">
      <ellipse cx="8" cy="8" rx="4" ry="7" fill="#fcf800" stroke="#000" stroke-width="1"/>
      <line x1="8" y1="4" x2="8" y2="12" stroke="#fc9838" stroke-width="1"/>
    </g>
    <text x="50" y="98" class="text-label">COINS COLLECTED:</text>
    <text x="245" y="98" class="text-val" id="val-stars">10</text>

    <!-- Levels Cleared -->
    <g transform="translate(24, 130)" class="powerup-icon">
      <rect x="3" y="1" width="10" height="13" fill="#00a800" stroke="#000" stroke-width="1"/>
      <rect x="1" y="1" width="14" height="4" fill="#00f800" stroke="#000" stroke-width="1"/>
    </g>
    <text x="50" y="138" class="text-label">LEVELS CLEARED:</text>
    <text x="245" y="138" class="text-val" id="val-repos">39</text>

    <!-- Allies -->
    <g transform="translate(24, 170)" class="powerup-icon">
      <circle cx="8" cy="6" r="6" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <circle cx="8" cy="11" r="4" fill="#ffcca0" stroke="#000" stroke-width="1"/>
    </g>
    <text x="50" y="178" class="text-label">PARTY ALLIES (NPC):</text>
    <text x="245" y="178" class="text-val" id="val-followers">14</text>

    <!-- Rank Status -->
    <text x="50" y="210" class="text-label">ADVENTURER RANK:</text>
    <text x="245" y="210" class="text-rank">S-RANK ARCHITECT</text>
  </g>

  <!-- PANEL 2: POWER-UPS -->
  <g transform="translate(445, 50)">
    <rect width="365" height="230" rx="8" class="box-container"/>
    <rect x="6" y="6" width="353" height="218" rx="5" class="box-inner"/>
    <rect x="8" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="347" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="8" y="212" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="347" y="212" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>

    <text x="24" y="30" class="text-panel-header">> POWER-UP ABILITIES</text>
    
    <!-- Skill 1: TypeScript -->
    <g transform="translate(18, 50)">
      <g class="powerup-icon"><circle cx="10" cy="10" r="9" fill="#ff3000" stroke="#000" stroke-width="1.5"/><circle cx="10" cy="10" r="5.5" fill="#fc9838"/><circle cx="10" cy="10" r="2.5" fill="#fcf800"/></g>
      <text x="28" y="12" class="text-label">TYPESCRIPT:</text>
      <!-- Segmented Level Meter -->
      <g transform="translate(165, 3)">
        <rect width="82" height="11" rx="2" fill="#111111" stroke="#000000" stroke-width="1.5"/>
        <rect width="63" height="7" x="2" y="2" rx="1" fill="#00a800" class="bar-glow"/>
      </g>
      <text x="260" y="12" class="text-val">LV.91</text>
    </g>
    <!-- Skill 2: Python -->
    <g transform="translate(18, 92)">
      <g class="powerup-icon"><path d="M 3 17 L 17 3 L 13 17 Z" fill="#00f0ff" stroke="#000" stroke-width="1.5"/><circle cx="9" cy="10" r="1.5" fill="#ffffff"/></g>
      <text x="28" y="12" class="text-label">PYTHON:</text>
      <!-- Segmented Level Meter -->
      <g transform="translate(165, 3)">
        <rect width="82" height="11" rx="2" fill="#111111" stroke="#000000" stroke-width="1.5"/>
        <rect width="40" height="7" x="2" y="2" rx="1" fill="#00a800" class="bar-glow"/>
      </g>
      <text x="260" y="12" class="text-val">LV.83</text>
    </g>
    <!-- Skill 3: JavaScript -->
    <g transform="translate(18, 134)">
      <g class="powerup-icon"><path d="M 3 10 C 3 2, 17 2, 17 10 Z" fill="#ff0000" stroke="#000" stroke-width="1.5"/><circle cx="7" cy="6" r="2" fill="#ffffff"/><circle cx="13" cy="6" r="2" fill="#ffffff"/><rect x="7" y="10" width="6" height="6" fill="#fce4a0" stroke="#000" stroke-width="1.5"/></g>
      <text x="28" y="12" class="text-label">JAVASCRIPT:</text>
      <!-- Segmented Level Meter -->
      <g transform="translate(165, 3)">
        <rect width="82" height="11" rx="2" fill="#111111" stroke="#000000" stroke-width="1.5"/>
        <rect width="18" height="7" x="2" y="2" rx="1" fill="#00a800" class="bar-glow"/>
      </g>
      <text x="260" y="12" class="text-val">LV.74</text>
    </g>
    <!-- Skill 4: HTML -->
    <g transform="translate(18, 176)">
      <g class="powerup-icon"><polygon points="10,2 12.5,7.5 18,7.5 13.5,11.5 15.5,17 10,13.5 4.5,17 6.5,11.5 2,7.5 7.5,7.5" fill="#fcf800" stroke="#000" stroke-width="1.5"/><circle cx="8" cy="8.5" r="1" fill="#000"/><circle cx="12" cy="8.5" r="1" fill="#000"/></g>
      <text x="28" y="12" class="text-label">HTML:</text>
      <!-- Segmented Level Meter -->
      <g transform="translate(165, 3)">
        <rect width="82" height="11" rx="2" fill="#111111" stroke="#000000" stroke-width="1.5"/>
        <rect width="18" height="7" x="2" y="2" rx="1" fill="#00a800" class="bar-glow"/>
      </g>
      <text x="260" y="12" class="text-val">LV.74</text>
    </g>
  </g>

  <!-- Ground -->
  <g transform="translate(0, 315)">
    <rect width="850" height="5" fill="#fc9838"/>
    <rect y="5" width="850" height="20" fill="#b83c18"/>
    <path d="M 0 5 L 850 5 M 0 12 L 850 12" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 20 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 40 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 60 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 80 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 100 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 120 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 140 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 160 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 180 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 200 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 220 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 240 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 260 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 280 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 300 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 320 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 340 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 360 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 380 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 400 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 420 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 440 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 460 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 480 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 500 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 520 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 540 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 560 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 580 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 600 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 620 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 640 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 660 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 680 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 700 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 720 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 740 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 760 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 780 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 800 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 820 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 840 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
  </g>
</svg>