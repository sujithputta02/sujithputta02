<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 375" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @font-face {
  font-family: 'Press Start 2P';
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
  font-weight: normal;
  font-style: normal;
}

      .bg-sky { fill: #5c94fc; }
      .cloud { fill: #ffffff; }

      .text-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 13px;
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 2.5;
        paint-order: stroke fill;
      }

      .quest-card-bg {
        fill: #fce4a0;
        stroke: #000000;
        stroke-width: 3;
      }
      .quest-card-inner {
        fill: none;
        stroke: #b83c18;
        stroke-width: 1.5;
      }

      .text-quest-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 9.5px;
        fill: #000000;
        font-weight: bold;
      }
      .text-meta-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 7.5px;
        fill: #b83c18;
        font-weight: bold;
      }
      .text-desc {
        font-family: 'Press Start 2P', monospace;
        font-size: 7.5px;
        fill: #4a3728;
      }

      .badge-level {
        fill: #fc9838;
        stroke: #000000;
        stroke-width: 1.5;
      }
      .badge-text {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        fill: #000000;
        font-weight: bold;
      }

      .coin-gold { fill: #fcf800; stroke: #000000; stroke-width: 1; }

      .cloud-bg-1 { animation: cloudDrift 60s infinite linear; }
      .cloud-bg-2 { animation: cloudDrift 90s infinite linear -45s; }

      @keyframes cloudDrift {
        0% { transform: translateX(850px); }
        100% { transform: translateX(-200px); }
      }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="850" height="375" class="bg-sky"/>

  <!-- Clouds Background -->
