<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @font-face {
  font-family: 'Press Start 2P';
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
  font-weight: normal;
  font-style: normal;
}

      .bg-sky { fill: #5c94fc; }
      .cloud { fill: #ffffff; }

      .text-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 13px;
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 2.5;
        paint-order: stroke fill;
      }
      .panel-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 9.5px;
        fill: #b83c18;
        font-weight: bold;
      }
      .stat-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        fill: #4a3728;
        font-weight: bold;
      }
      .stat-val {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        fill: #008800;
        font-weight: bold;
      }
      .box-container {
        fill: #fce4a0;
        stroke: #000000;
        stroke-width: 3.5;
      }
      .box-inner {
        fill: none;
        stroke: #b83c18;
        stroke-width: 1.5;
      }

      /* Streak Ring Pulse */
      .streak-ring {
        animation: flameRingPulse 2s infinite ease-in-out;
      }
      @keyframes flameRingPulse {
        0%, 100% { stroke: #e52521; stroke-width: 3.5; }
        50% { stroke: #fc9838; stroke-width: 5; }
      }

      .star-spin {
        animation: starSpinBob 2s infinite ease-in-out;
      }
      @keyframes starSpinBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      .cloud-bg-1 { animation: cloudDrift 60s infinite linear; }
      .cloud-bg-2 { animation: cloudDrift 90s infinite linear -30s; }

      @keyframes cloudDrift {
        0% { transform: translateX(850px); }
        100% { transform: translateX(-200px); }
      }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="850" height="440" class="bg-sky"/>

  <!-- Clouds -->
  <g class="cloud-bg-1" transform="translate(80, 10)">
    <path d="M120,20 C110,20 100,28 100,38 C90,38 80,46 80,56 C80,66 90,74 100,74 L160,74 C170,74 180,66 180,56 C180,46 170,38 160,38 C160,28 150,20 140,20 Z" class="cloud" opacity="0.6"/>
  </g>
  <g class="cloud-bg-2" transform="translate(520, 20)">
    <path d="M60,10 C55,10 50,14 50,19 C45,19 40,23 40,28 C40,33 45,37 50,37 L80,37 C85,37 90,33 90,28 C90,23 85,19 80,19 C80,14 75,10 70,10 Z" class="cloud" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="425" y="32" class="text-title" text-anchor="middle">> SYSTEM PERFORMANCE METRICS &lt;</text>

  <!-- CARD 1: GITHUB ARCADE STATS (Top Left) -->
  <g transform="translate(35, 48)">
    <rect width="375" height="195" rx="8" class="box-container"/>
    <rect x="6" y="6" width="363" height="183" rx="5" class="box-inner"/>
    <rect x="8" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="357" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="8" y="177" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="357" y="177" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>

    <text x="24" y="28" class="panel-title">> SUJITH GITHUB STATS</text>

    <!-- Star Count -->
    <g transform="translate(24, 48)">
      <polygon points="6,0 8,4 12,4 9,7 10,12 6,9 2,12 3,7 0,4 4,4" fill="#fcf800" stroke="#000" stroke-width="1"/>
      <text x="20" y="9" class="stat-label">TOTAL STARS EARNED:</text>
      <text x="260" y="9" class="stat-val">10</text>
    </g>

    <!-- Commits -->
    <g transform="translate(24, 76)">
      <circle cx="6" cy="6" r="5" fill="#a85400" stroke="#000" stroke-width="1"/>
      <text x="20" y="9" class="stat-label">TOTAL COMMITS:</text>
      <text x="260" y="9" class="stat-val">916</text>
    </g>

    <!-- PRs -->
    <g transform="translate(24, 104)">
      <circle cx="6" cy="6" r="5" fill="#00a800" stroke="#000" stroke-width="1"/>
      <text x="20" y="9" class="stat-label">TOTAL PRS MERGED:</text>
      <text x="260" y="9" class="stat-val">65</text>
    </g>

    <!-- Issues -->
    <g transform="translate(24, 132)">
      <circle cx="6" cy="6" r="5" fill="#fc9838" stroke="#000" stroke-width="1"/>
      <text x="20" y="9" class="stat-label">TOTAL ISSUES CLOSED:</text>
      <text x="260" y="9" class="stat-val">50</text>
    </g>

    <!-- Rank Tier -->
    <g transform="translate(24, 160)">
      <text x="20" y="9" class="stat-label">CONTRIBUTION TIER:</text>
      <text x="220" y="9" font-family="'Press Start 2P', monospace" font-size="8" fill="#e52521" font-weight="bold">S-TIER ★★★</text>
    </g>
  </g>

  <!-- CARD 2: MOST USED POWER-UP LANGUAGES (Top Right) -->
  <g transform="translate(440, 48)">
    <rect width="375" height="195" rx="8" class="box-container"/>
    <rect x="6" y="6" width="363" height="183" rx="5" class="box-inner"/>
    <rect x="8" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="357" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="8" y="177" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="357" y="177" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>

    <text x="24" y="28" class="panel-title">> MOST USED LANGUAGES</text>

    <!-- Multi-Color Segmented Power-Up Bar -->
    <g transform="translate(22, 38)">
      <rect width="332" height="14" rx="3" fill="#111111" stroke="#000" stroke-width="1.5"/>
      <g transform="translate(1, 1)" clip-path="url(#bar-clip)">
        <rect x="0" y="0" width="180" height="12" fill="#e34c26"/><rect x="180" y="0" width="101" height="12" fill="#3178c6"/><rect x="281" y="0" width="23" height="12" fill="#3572A5"/><rect x="304" y="0" width="16" height="12" fill="#f1e05a"/><rect x="320" y="0" width="4" height="12" fill="#dea584"/><rect x="324" y="0" width="4" height="12" fill="#89e051"/>
      </g>
      <clipPath id="bar-clip">
        <rect width="330" height="12" rx="2"/>
      </clipPath>
    </g>

    <!-- 2 Column Language List -->
    <g transform="translate(4, 12)">
      
    <g transform="translate(20, 52)">
      <circle cx="6" cy="6" r="4" fill="#e34c26" stroke="#000" stroke-width="1"/>
      <text x="16" y="9" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#000000">HTML/Web 54.7%</text>
    </g>
    <g transform="translate(195, 52)">
      <circle cx="6" cy="6" r="4" fill="#f1e05a" stroke="#000" stroke-width="1"/>
      <text x="16" y="9" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#000000">JavaScript 5.0%</text>
    </g>
    <g transform="translate(20, 80)">
      <circle cx="6" cy="6" r="4" fill="#3178c6" stroke="#000" stroke-width="1"/>
      <text x="16" y="9" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#000000">TypeScript 30.7%</text>
    </g>
    <g transform="translate(195, 80)">
      <circle cx="6" cy="6" r="4" fill="#dea584" stroke="#000" stroke-width="1"/>
      <text x="16" y="9" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#000000">Rust 1.2%</text>
    </g>
    <g transform="translate(20, 108)">
      <circle cx="6" cy="6" r="4" fill="#3572A5" stroke="#000" stroke-width="1"/>
      <text x="16" y="9" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#000000">Python 7.1%</text>
    </g>
    <g transform="translate(195, 108)">
      <circle cx="6" cy="6" r="4" fill="#89e051" stroke="#000" stroke-width="1"/>
      <text x="16" y="9" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#000000">Shell/Other 1.3%</text>
    </g>
    </g>
  </g>

  <!-- CARD 3: CONTINUOUS ADVENTURE & STREAK (Bottom Full Width) -->
  <g transform="translate(35, 258)">
    <rect width="780" height="145" rx="8" class="box-container"/>
    <rect x="6" y="6" width="768" height="133" rx="5" class="box-inner"/>
    <rect x="8" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="762" y="8" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="8" y="127" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>
    <rect x="762" y="127" width="10" height="10" fill="#fc9838" stroke="#000" stroke-width="1"/>

    <!-- Column 1: Total Contributions -->
    <g transform="translate(130, 40)">
      <text x="0" y="24" font-family="'Press Start 2P', monospace" font-size="20" fill="#000000" font-weight="bold" text-anchor="middle">1,600</text>
      <text x="0" y="52" font-family="'Press Start 2P', monospace" font-size="8" fill="#4a3728" font-weight="bold" text-anchor="middle">TOTAL CONTRIBUTIONS</text>
      <text x="0" y="74" font-family="'Press Start 2P', monospace" font-size="7" fill="#b83c18" text-anchor="middle">Oct 4, 2024 - Present</text>
    </g>

    <!-- Divider Line 1 -->
    <line x1="260" y1="25" x2="260" y2="120" stroke="#b83c18" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Column 2: Current Streak (Center Hero) -->
    <g transform="translate(390, 20)">
      <!-- Flame Icon on Top -->
      <g transform="translate(-8, 5)" class="star-spin">
        <path d="M 8 0 C 4 6, 2 10, 8 16 C 14 10, 12 6, 8 0 Z" fill="#e52521"/>
        <path d="M 8 4 C 6 8, 4 10, 8 13 C 12 10, 10 8, 8 4 Z" fill="#fc9838"/>
      </g>
      <!-- Circular Combo Ring -->
      <circle cx="0" cy="46" r="28" fill="#ffffff" stroke="#e52521" stroke-width="4" class="streak-ring"/>
      <text x="0" y="54" font-family="'Press Start 2P', monospace" font-size="22" fill="#000000" font-weight="bold" text-anchor="middle">1</text>

      <text x="0" y="92" font-family="'Press Start 2P', monospace" font-size="8.5" fill="#b83c18" font-weight="bold" text-anchor="middle">CURRENT COMBO</text>
      <text x="0" y="108" font-family="'Press Start 2P', monospace" font-size="7" fill="#008800" font-weight="bold" text-anchor="middle">★ STAGE ACTIVE TODAY ★</text>
    </g>

    <!-- Divider Line 2 -->
    <line x1="520" y1="25" x2="520" y2="120" stroke="#b83c18" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Column 3: Longest Streak -->
    <g transform="translate(650, 40)">
      <text x="0" y="24" font-family="'Press Start 2P', monospace" font-size="20" fill="#000000" font-weight="bold" text-anchor="middle">8</text>
      <text x="0" y="52" font-family="'Press Start 2P', monospace" font-size="8" fill="#4a3728" font-weight="bold" text-anchor="middle">LONGEST STREAK</text>
      <text x="0" y="74" font-family="'Press Start 2P', monospace" font-size="7" fill="#b83c18" text-anchor="middle">Apr 14 - Apr 21 Record</text>
    </g>
  </g>

  <!-- Ground Terrain -->
  <g transform="translate(0, 415)">
    <rect width="850" height="5" fill="#fc9838"/>
    <rect y="5" width="850" height="20" fill="#b83c18"/>
    <path d="M 0 5 L 850 5 M 0 12 L 850 12" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 20 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 40 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 60 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 80 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 100 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 120 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 140 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 160 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 180 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 200 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 220 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 240 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 260 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 280 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 300 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 320 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 340 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 360 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 380 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 400 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 420 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 440 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 460 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 480 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 500 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 520 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 540 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 560 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 580 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 600 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 620 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 640 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 660 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 680 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 700 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 720 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 740 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 760 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 780 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 800 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 820 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/> <path d="M 840 0 v 25" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
  </g>
</svg>